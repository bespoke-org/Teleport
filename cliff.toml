# git-cliff configuration: https://git-cliff.org/docs/configuration
# Adapted from Picodata's cliff.toml for upstream git-cliff and GitHub.

[changelog]
# git-cliff writes the header plus a newline, then the release bodies back to
# back. `--prepend` removes this header from CHANGELOG.md and writes it again
# above the new section, so it must match the top of the file byte for byte.
header = """
# Changelog

Format is based on [_Keep a changelog_](https://keepachangelog.com) and uses
[_Semantic versioning_](https://semver.org).
"""
# Every section starts with a blank line and the body ends with one newline,
# so a prepended section is followed by exactly one blank line. The
# postprocessor removes the blank line between the release heading and its
# first section, as in the hand-written releases.
body = """
{%- if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif -%}

{%- macro commit(commit) -%}
{#- A non-conventional commit's message is its whole text; keep line one. -#}
{%- set subject = commit.message | split(pat="\n") | first | trim | upper_first -%}
{%- if commit.scope %}- **({{ commit.scope }})** {{ subject }}
{%- else %}- {{ subject }}
{%- endif -%}
{%- endmacro commit -%}

{#- Breaking changes get their own section; the group loops skip them.
    `breaking` is None (not false) for non-conventional commits, so the
    groups are not pre-filtered with filter(value=false). -#}
{%- set breakings = commits | filter(attribute="breaking", value=true) -%}
{%- if breakings | length > 0 %}

### Breaking changes
{%- for c in breakings %}
{{ self::commit(commit=c) }}
{%- endfor -%}
{%- endif -%}

{%- for group, group_commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}
{%- for c in group_commits | filter(attribute="scope") | sort(attribute="scope") -%}
{%- if not c.breaking %}
{{ self::commit(commit=c) }}
{%- endif -%}
{%- endfor -%}
{%- for c in group_commits -%}
{%- if not c.breaking and not c.scope %}
{{ self::commit(commit=c) }}
{%- endif -%}
{%- endfor -%}
{%- endfor %}
"""
trim = false
postprocessors = [
    { pattern = '^(## .*)\n\n###', replace = "$1\n###" },
]

[git]
# History before the convention has non-conventional subjects; they are kept
# and land in the catch-all group at the end of commit_parsers.
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Skip rules first, then grouping rules; the HTML comments fix group order.
commit_parsers = [
    { message = "^chore(\\(.*\\))?: (release|prepare release)", skip = true },
    { message = "^chore.*CHANGELOG", skip = true },
    # An unsquashed fixup repeats the subject of the commit it amends.
    { message = "^(fixup|squash|amend)! ", skip = true },

    { message = "^feat",              group = "<!-- 1 -->Features" },
    { message = "^fix",               group = "<!-- 2 -->Bug fixes" },
    { message = "^refactor",          group = "<!-- 3 -->Refactor" },
    { message = "^docs?",             group = "<!-- 4 -->Documentation" },
    { message = "^perf",              group = "<!-- 5 -->Performance" },
    # `verify:` changes the scripts/verify_*.swift programs, the project's tests.
    { message = "^(test|verify)",     group = "<!-- 6 -->Testing" },
    { message = "^(chore|style)",     group = "<!-- 7 -->Miscellaneous" },
    { message = "^(R|r)evert",        group = "<!-- 8 -->Revert" },
    { message = "^(build|ci)",        group = "<!-- 9 -->Build" },

    # Non-conventional subjects: "Add ..."/"Fix ..." by their verb, the rest
    # as miscellaneous.
    { message = "^Add ",              group = "<!-- 1 -->Features" },
    { message = "^Fix ",              group = "<!-- 2 -->Bug fixes" },
    { message = ".*",                 group = "<!-- 7 -->Miscellaneous" },
]
filter_commits = false
fail_on_unmatched_commit = false
use_branch_tags = true
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
