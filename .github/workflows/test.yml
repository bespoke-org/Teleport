name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Foundation's behaviour differs between macOS releases, so the checks run on
    # each supported one, on arm64 and on x86_64. The macos-15 images ship
    # Xcode 26 but not as the default. The xcode-27 preview image runs macOS 27,
    # has only Xcode 27 and has no x86_64 variant.
    # Without Config/Local.xcconfig the build is signed ad hoc.
    name: macOS ${{ matrix.macos }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: 15
            arch: arm64
            runner: macos-15
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
          - macos: 15
            arch: x86_64
            runner: macos-15-intel
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
          - macos: 26
            arch: arm64
            runner: macos-26
            developer-dir: /Applications/Xcode.app/Contents/Developer
          - macos: 26
            arch: x86_64
            runner: macos-26-intel
            developer-dir: /Applications/Xcode.app/Contents/Developer
          - macos: 27
            arch: arm64
            runner: xcode-27
            developer-dir: /Applications/Xcode.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Show the macOS and Xcode in use
        run: sw_vers && xcodebuild -version

      - name: Install just
        run: brew install just

      - run: just build-debug

      - run: just test

  # Builds the .dmg and the zipped app the way a release does and keeps them as artifacts of the run.
  package:
    if: github.event_name == 'push'
    uses: ./.github/workflows/package.yml
