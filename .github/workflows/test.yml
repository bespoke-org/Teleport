# Builds the Debug app and runs the checks on each runner in the matrix the caller passes.
# Pull request runs it on one runner, Main on each supported macOS.
name: Test

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON list of {macos, arch, runner, developer-dir}
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    # Without Config/Local.xcconfig the build is signed ad hoc.
    name: macOS ${{ matrix.macos }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Show the macOS and Xcode in use
        run: sw_vers && xcodebuild -version

      - name: Install just
        run: brew install just

      - run: just build-debug

      - run: just test
