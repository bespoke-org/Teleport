name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cover the oldest supported macOS and the release image on arm64. The macOS 15
  # image also exercises selecting a non-default Xcode. Develop covers the remaining runners.
  test:
    uses: ./.github/workflows/test.yml
    with:
      matrix: |
        [
          {"macos": 15, "arch": "arm64", "runner": "macos-15", "developer-dir": "/Applications/Xcode_26.3.app/Contents/Developer"},
          {"macos": 26, "arch": "arm64", "runner": "macos-26", "developer-dir": "/Applications/Xcode.app/Contents/Developer"}
        ]
