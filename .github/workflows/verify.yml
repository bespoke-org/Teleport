name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # macOS 26 arm64 image; its default Xcode is 26.x, which the macOS 26.0 deployment target needs.
    # Without Config/Local.xcconfig the build is signed ad hoc.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Show the Xcode in use
        run: xcodebuild -version

      - name: Install just
        run: brew install just

      - run: just verify
